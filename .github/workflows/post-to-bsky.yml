name: Mimetic Bunker Bluesky bot

on:
  schedule:
    - cron: '17,47 10-13 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without posting
        required: true
        default: true
        type: boolean
      mode:
        description: What to preview or publish manually
        required: true
        default: archive
        type: choice
        options:
          - archive
          - auto
      essay_number:
        description: Archive essay number; 0 chooses automatically
        required: true
        default: '0'
        type: string
      extra_direction:
        description: Optional one-run AI archive direction
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mimetic-bunker-bluesky-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      EDITORIAL_NOTES: ${{ vars.EDITORIAL_NOTES }}
      EXTRA_DIRECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_direction || '' }}
      MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      MANUAL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
      MANUAL_ESSAY_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.essay_number || '0' }}
      TRIGGER_EVENT: ${{ github.event_name }}
      TRIGGER_SCHEDULE: ${{ github.event.schedule || '' }}
      SUBSTACK_FEED_URL: https://mimeticbunker.substack.com/feed

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Choose and publish the morning post
        shell: bash
        run: |
          node <<'BOT'
          const fs = require('node:fs');
          const FEED_URL = process.env.SUBSTACK_FEED_URL;
          const HANDLE = process.env.BLUESKY_HANDLE || 'mimeticbunker.bsky.social';
          const APP_PASSWORD = process.env.BLUESKY_APP_PASSWORD || '';
          const DEEPSEEK_API_KEY = process.env.DEEPSEEK_API_KEY || '';
          const DRY_RUN = process.env.DRY_RUN !== 'false';
          const MANUAL_RUN = process.env.MANUAL_RUN === 'true';
          const MANUAL_MODE = process.env.MANUAL_MODE || 'auto';
          const MANUAL_ESSAY_NUMBER = process.env.MANUAL_ESSAY_NUMBER || '0';
          const TRIGGER_EVENT = process.env.TRIGGER_EVENT || 'unknown';
          const TRIGGER_SCHEDULE = process.env.TRIGGER_SCHEDULE || '';
          const EDITORIAL_NOTES = process.env.EDITORIAL_NOTES || '';
          const EXTRA_DIRECTION = process.env.EXTRA_DIRECTION || '';
          const SERVICE = 'https://bsky.social';
          const DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';
          const WRITER_MODEL = 'deepseek-v4-flash';
          const EDITOR_MODEL = 'deepseek-v4-pro';
          const MAX_POST_LENGTH = 300;
          const TIME_ZONE = 'America/New_York';
          const DECISION_FILE = 'bot-decision.md';
          const TIMEOUT_MS = 15_000;
